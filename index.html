<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Room Aco Meter">
  <title>ROOM·ACO·METER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0c;
      --surface: #0d1117;
      --panel: #111820;
      --border: #1e2d3d;
      --amber: #f5a623;
      --green: #39ff7a;
      --red: #ff3b3b;
      --blue: #4fc3f7;
      --purple: #c084fc;
      --text: #c9d1d9;
      --text-dim: #556070;
      --black: #050607;
      --radius: 8px;
      --shadow: 0 0 28px rgba(245, 166, 35, 0.13);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(17, 24, 32, 0.92), rgba(8, 10, 12, 1) 360px),
        var(--bg);
      color: var(--text);
      font-family: Rajdhani, "Courier New", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    canvas {
      display: block;
      width: 100%;
      background: #07090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
      background: rgba(8, 10, 12, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .logo {
      color: var(--amber);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 20px;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(245, 166, 35, 0.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(88px, 1fr));
      gap: 8px;
      align-items: center;
      flex: 0 1 250px;
    }

    .tab {
      min-height: 38px;
      padding: 8px 14px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 700;
      text-transform: uppercase;
    }

    [data-current="true"] {
      color: var(--amber);
      border-color: var(--amber);
      background: rgba(245, 166, 35, 0.12);
      box-shadow: var(--shadow);
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px 16px 150px;
    }

    .view {
      display: grid;
      gap: 22px;
    }

    [data-visible="false"] {
      display: none;
    }

    .panel {
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .meter-core {
      display: grid;
      gap: 20px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-button {
      min-width: 132px;
      min-height: 44px;
      border: 1px solid var(--amber);
      border-radius: var(--radius);
      background: rgba(245, 166, 35, 0.14);
      color: var(--amber);
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: var(--shadow);
    }

    .danger-button {
      min-height: 38px;
      border: 1px solid rgba(255, 59, 59, 0.8);
      border-radius: var(--radius);
      background: rgba(255, 59, 59, 0.1);
      color: var(--red);
      font-weight: 700;
      text-transform: uppercase;
    }

    .ghost-button {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(17, 24, 32, 0.72);
      color: var(--text);
      font-weight: 700;
      text-transform: uppercase;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(17, 24, 32, 0.85);
      color: var(--text);
      font-family: "Share Tech Mono", "Courier New", monospace;
      line-height: 1;
    }

    .mic-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      background: rgba(17, 24, 32, 0.72);
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    [data-active="true"] {
      color: var(--green);
      border-color: rgba(57, 255, 122, 0.45);
    }

    [data-active="true"] [data-status-dot] {
      background: var(--green);
      box-shadow: 0 0 14px rgba(57, 255, 122, 0.8);
    }

    .readout-wrap {
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 4px 0 0;
    }

    .db-readout {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      width: 100%;
      color: var(--green);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 78px;
      line-height: 0.95;
      text-align: center;
      white-space: normal;
    }

    .db-unit {
      color: var(--text-dim);
      font-family: Rajdhani, "Courier New", sans-serif;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .level-bar {
      position: relative;
      width: 100%;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--green) 36%, var(--amber) 58%, var(--red) 100%);
    }

    .level-pin {
      position: absolute;
      top: -7px;
      left: 0;
      width: 3px;
      height: 30px;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
      transform: translateX(-1px);
    }

    .env-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-self: center;
      min-height: 34px;
      padding: 6px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(17, 24, 32, 0.8);
      color: var(--text);
      font-weight: 700;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.25s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(57, 255, 122, 0.6); }
      70% { box-shadow: 0 0 0 9px rgba(57, 255, 122, 0); }
      100% { box-shadow: 0 0 0 0 rgba(57, 255, 122, 0); }
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
      padding: 9px 10px;
      background: rgba(17, 24, 32, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .stat-box {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    .stat-label {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.1;
    }

    .tone-blue {
      color: var(--blue);
    }

    .tone-amber {
      color: var(--amber);
    }

    .tone-red {
      color: var(--red);
    }

    .tone-purple {
      color: var(--purple);
    }

    .canvas-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .history-canvas {
      height: 60px;
    }

    .spectrum-canvas {
      height: 60px;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .bands-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
      cursor: pointer;
    }

    .band-box {
      display: grid;
      gap: 7px;
      min-width: 0;
      padding: 8px 6px;
      background: rgba(17, 24, 32, 0.72);
      border: 1px solid rgba(30, 45, 61, 0.85);
      border-radius: var(--radius);
      text-align: center;
    }

    .band-label {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
    }

    .band-track {
      position: relative;
      align-self: stretch;
      width: 100%;
      height: 9px;
      margin: 0 auto;
      border-radius: 999px;
      background: #071018;
      border: 1px solid rgba(201, 209, 217, 0.08);
    }

    .band-fill {
      position: absolute;
      left: 1px;
      top: 1px;
      bottom: 1px;
      min-height: 3px;
      min-width: 3px;
      border-radius: 999px;
      background: var(--blue);
    }

    .band-value {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 15px;
    }

    .bands-hint {
      margin-top: 10px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
    }

    .capture-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 18;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      background: rgba(8, 10, 12, 0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .capture-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .capture-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      align-items: center;
    }

    .name-input {
      min-height: 44px;
      width: 100%;
      min-width: 0;
      padding: 8px 11px;
      color: var(--text);
      background: #07090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .hint {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 700;
    }

    #sampleHint {
      grid-column: 1 / -1;
      margin-top: 0;
    }

    [data-ready="true"] {
      color: var(--green);
    }

    .spots-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .spot-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .spot-index {
      color: var(--amber);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 22px;
    }

    .spot-main {
      min-width: 0;
    }

    .spot-name {
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .spot-meta {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
    }

    .spot-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      grid-column: 1 / -1;
      margin-top: 2px;
    }

    .preview-pill {
      padding: 4px 7px;
      color: var(--text);
      background: rgba(79, 195, 247, 0.08);
      border: 1px solid rgba(79, 195, 247, 0.24);
      border-radius: 999px;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 12px;
    }

    .spot-db {
      min-width: 104px;
      text-align: right;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 36px;
      line-height: 1;
    }

    .spot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clear-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .empty-state {
      padding: 34px 16px;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      font-weight: 700;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .report-title {
      margin: 0;
      color: var(--amber);
      font-size: 28px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .report-meta {
      color: var(--text-dim);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 14px;
      text-align: right;
    }

    .comparison-canvas {
      height: 260px;
    }

    .findings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .finding-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .finding-box {
      min-width: 0;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .finding-item {
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .finding-label {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .finding-value {
      margin-top: 5px;
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
    }

    .report-card {
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .report-card-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 0;
      color: var(--text);
      text-align: left;
    }

    .report-card-body {
      display: grid;
      gap: 14px;
      padding: 0 12px 14px;
    }

    .report-name {
      min-width: 0;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .report-avg {
      color: var(--amber);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 28px;
      white-space: nowrap;
    }

    .report-score {
      color: var(--text-dim);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 16px;
      white-space: nowrap;
    }

    .collapse-arrow {
      color: var(--text-dim);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 18px;
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 8px;
    }

    .section-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .section-tab {
      min-height: 36px;
      padding: 7px 8px;
      color: var(--text-dim);
      background: rgba(17, 24, 32, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    [data-section-active="true"] {
      color: var(--amber);
      border-color: rgba(245, 166, 35, 0.8);
      background: rgba(245, 166, 35, 0.12);
    }

    .metric-tile {
      min-width: 0;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .metric-label {
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 4px;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 20px;
    }

    .band-values-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px;
    }

    .band-value-box {
      min-width: 0;
      padding: 9px 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
    }

    .score-wrap {
      display: grid;
      gap: 10px;
    }

    .score-line {
      display: grid;
      gap: 6px;
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-weight: 700;
    }

    .score-bar {
      height: 12px;
      background: #07090b;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--amber);
    }

    .assessment {
      display: grid;
      gap: 8px;
      padding: 12px;
      background: rgba(245, 166, 35, 0.06);
      border-left: 3px solid var(--amber);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .assessment-line {
      color: var(--text);
      line-height: 1.35;
    }

    .assessment-more {
      justify-self: start;
      min-height: 32px;
      padding: 5px 9px;
      color: var(--amber);
      background: rgba(245, 166, 35, 0.1);
      border: 1px solid rgba(245, 166, 35, 0.45);
      border-radius: var(--radius);
      font-weight: 700;
      text-transform: uppercase;
    }

    .recommendations {
      display: grid;
      gap: 7px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .recommendation {
      color: var(--text);
      line-height: 1.35;
    }

    .snapshot-canvas {
      height: 70px;
    }

    .mobile-stack {
      min-width: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">ROOM·ACO·METER</div>
    <nav class="tabs" aria-label="App views">
      <button class="tab" type="button" data-tab="meter" data-current="true">Meter</button>
      <button class="tab" type="button" data-tab="analysis" data-current="false">Analysis</button>
    </nav>
  </header>

  <main class="shell">
    <section id="meterPanel" class="view" data-visible="true" aria-label="Meter">
      <div class="panel meter-core">
        <div class="control-row">
          <button id="startStopBtn" class="primary-button" type="button">Start</button>
          <div id="micPill" class="mic-pill" data-active="false"><span class="status-dot" data-status-dot></span><span>Mic inactive</span></div>
        </div>

        <div class="readout-wrap">
          <div id="dbReadout" class="db-readout"><span id="dbValue">—</span><span class="db-unit">dB SPL</span></div>
          <div class="level-bar" aria-hidden="true"><div id="levelPin" class="level-pin"></div></div>
          <div id="envBadge" class="env-badge"><span id="envDot" class="pulse-dot"></span><span id="envText">Silence</span></div>
        </div>

        <div class="stats-row">
          <div class="stat-box"><span class="stat-label">MIN</span><span id="statMin" class="stat-value tone-blue">—</span></div>
          <div class="stat-box"><span class="stat-label">AVG</span><span id="statAvg" class="stat-value tone-amber">—</span></div>
          <div class="stat-box"><span class="stat-label">MAX</span><span id="statMax" class="stat-value tone-red">—</span></div>
          <div class="stat-box"><span class="stat-label">±</span><span id="statVar" class="stat-value tone-purple">—</span></div>
        </div>

        <div>
          <div class="canvas-title"><span>Level history</span><span>rolling 300 samples</span></div>
          <canvas id="historyCanvas" class="history-canvas" height="60" aria-label="Level history waveform"></canvas>
        </div>

        <div>
          <div class="canvas-title"><span>FFT spectrum</span><span>20 Hz - 20 kHz</span></div>
          <canvas id="fftCanvas" class="spectrum-canvas" height="60" aria-label="FFT spectrum"></canvas>
        </div>
      </div>

      <section class="panel">
        <h2 class="section-title">Octave Bands</h2>
        <div id="bandsGrid" class="bands-grid" aria-label="Octave band levels" role="button" tabindex="0"></div>
        <div id="bandsHint" class="bands-hint">Tap bands to show values</div>
      </section>

      <section class="panel">
        <h2 class="section-title">Room Positions</h2>
        <div id="spotsList" class="spots-list" aria-live="polite"></div>
        <div class="clear-row">
          <button id="clearAllBtn" class="danger-button" type="button">Clear All</button>
        </div>
      </section>

      <section class="capture-dock" aria-label="Capture controls">
        <div class="capture-inner">
          <input id="spotName" class="name-input" type="text" maxlength="48" placeholder="Position name">
          <button id="captureBtn" class="primary-button" type="button">Capture</button>
          <div id="sampleHint" class="hint" data-ready="false">Collecting… (0)</div>
        </div>
      </section>
    </section>

    <section id="analysisPanel" class="view" data-visible="false" aria-label="Analysis">
      <div id="analysisContent" class="mobile-stack"></div>
    </section>
  </main>

  <script>
    "use strict";

    const BANDS = [63, 125, 250, 500, 1000, 2000, 4000, 8000];
    const MAX_HISTORY = 300;
    const DB_MAX = 120;
    const FFT_MIN_DB = -120;
    const FFT_MAX_DB = 0;

    const STATE = {
      running: false,
      audioCtx: null,
      analyser: null,
      stream: null,
      rafId: null,
      fftBuf: null,
      timeBuf: null,
      acc: { min: Infinity, max: -Infinity, sum: 0, count: 0 },
      history: [],
      spots: [],
      expandedCards: {}
    };

    const els = {
      startStopBtn: document.getElementById("startStopBtn"),
      micPill: document.getElementById("micPill"),
      dbReadout: document.getElementById("dbReadout"),
      dbValue: document.getElementById("dbValue"),
      levelPin: document.getElementById("levelPin"),
      envBadge: document.getElementById("envBadge"),
      envDot: document.getElementById("envDot"),
      envText: document.getElementById("envText"),
      statMin: document.getElementById("statMin"),
      statAvg: document.getElementById("statAvg"),
      statMax: document.getElementById("statMax"),
      statVar: document.getElementById("statVar"),
      historyCanvas: document.getElementById("historyCanvas"),
      fftCanvas: document.getElementById("fftCanvas"),
      bandsGrid: document.getElementById("bandsGrid"),
      bandsHint: document.getElementById("bandsHint"),
      spotName: document.getElementById("spotName"),
      captureBtn: document.getElementById("captureBtn"),
      sampleHint: document.getElementById("sampleHint"),
      spotsList: document.getElementById("spotsList"),
      clearAllBtn: document.getElementById("clearAllBtn"),
      meterPanel: document.getElementById("meterPanel"),
      analysisPanel: document.getElementById("analysisPanel"),
      analysisContent: document.getElementById("analysisContent"),
      tabs: Array.from(document.querySelectorAll(".tab"))
    };

    installManifest();
    renderAll();
    resizeVisuals();

    els.startStopBtn.addEventListener("click", toggleAudio);
    els.captureBtn.addEventListener("click", captureSpot);
    els.clearAllBtn.addEventListener("click", clearAllSpots);
    els.bandsGrid.addEventListener("click", toggleBands);
    els.bandsGrid.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleBands();
      }
    });
    window.addEventListener("resize", () => {
      resizeVisuals();
      drawHistory();
      drawSpectrum(STATE.fftBuf);
      renderAnalysisCanvases();
    });

    els.tabs.forEach((tab) => {
      tab.addEventListener("click", () => setView(tab.dataset.tab));
    });

    els.spotsList.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-spot]");
      if (!removeButton) return;
      const id = Number(removeButton.dataset.removeSpot);
      STATE.spots = STATE.spots.filter((spot) => spot.id !== id);
      delete STATE.expandedCards[`spot-${id}`];
      delete STATE.expandedCards[`report-${id}`];
      delete STATE.expandedCards[`assessment-${id}`];
      renderAll();
      return;
    });

    els.spotsList.addEventListener("click", (event) => {
      if (event.target.closest("[data-remove-spot]")) return;
      const card = event.target.closest("[data-toggle-spot]");
      if (!card) return;
      const id = Number(card.dataset.toggleSpot);
      const key = `spot-${id}`;
      STATE.expandedCards[key] = STATE.expandedCards[key] !== true;
      renderSpotsList();
    });

    els.analysisContent.addEventListener("click", (event) => {
      const toggleButton = event.target.closest("[data-toggle-card]");
      const sectionButton = event.target.closest("[data-section-tab]");
      const readMoreButton = event.target.closest("[data-read-assessment]");
      if (toggleButton) {
        const id = Number(toggleButton.dataset.toggleCard);
        const key = `report-${id}`;
        STATE.expandedCards[key] = STATE.expandedCards[key] !== true;
        renderAnalysis();
        return;
      }
      if (sectionButton) {
        const id = Number(sectionButton.dataset.sectionTab);
        const section = sectionButton.dataset.reportSection;
        setReportSection(id, section);
        renderAnalysis();
        return;
      }
      if (readMoreButton) {
        const id = Number(readMoreButton.dataset.readAssessment);
        const key = `assessment-${id}`;
        STATE.expandedCards[key] = STATE.expandedCards[key] !== true;
        renderAnalysis();
      }
    });

    async function toggleAudio() {
      if (STATE.running) {
        stopAudio();
        return;
      }
      await startAudio();
    }

    async function startAudio() {
      try {
        const constraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtor();
        await audioCtx.resume();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        analyser.minDecibels = FFT_MIN_DB;
        analyser.maxDecibels = FFT_MAX_DB;
        analyser.smoothingTimeConstant = 0.62;

        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        STATE.running = true;
        STATE.audioCtx = audioCtx;
        STATE.analyser = analyser;
        STATE.stream = stream;
        STATE.fftBuf = new Float32Array(analyser.frequencyBinCount);
        STATE.timeBuf = new Float32Array(analyser.fftSize);
        STATE.rafId = requestAnimationFrame(tick);
        renderControls();
      } catch (error) {
        alert("Microphone access failed. Open this page over HTTPS and allow mic permission.");
        console.error(error);
        stopAudio();
      }
    }

    function stopAudio() {
      if (STATE.rafId !== null) {
        cancelAnimationFrame(STATE.rafId);
      }
      if (STATE.stream) {
        STATE.stream.getTracks().forEach((track) => track.stop());
      }
      if (STATE.audioCtx && STATE.audioCtx.state !== "closed") {
        STATE.audioCtx.close().catch(() => {});
      }
      STATE.running = false;
      STATE.audioCtx = null;
      STATE.analyser = null;
      STATE.stream = null;
      STATE.rafId = null;
      STATE.fftBuf = null;
      STATE.timeBuf = null;
      renderControls();
      renderSampleHint();
    }

    function tick() {
      if (!STATE.running || !STATE.analyser || !STATE.fftBuf || !STATE.timeBuf) return;
      STATE.analyser.getFloatTimeDomainData(STATE.timeBuf);
      STATE.analyser.getFloatFrequencyData(STATE.fftBuf);

      const db = rmsToDb(STATE.timeBuf);
      updateAccumulator(db);
      renderMeter(db);
      drawHistory();
      drawSpectrum(STATE.fftBuf);
      renderLiveBands(db);
      STATE.rafId = requestAnimationFrame(tick);
    }

    function rmsToDb(timeBuf) {
      let sumSquares = 0;
      for (let i = 0; i < timeBuf.length; i += 1) {
        sumSquares += timeBuf[i] * timeBuf[i];
      }
      const rms = Math.sqrt(sumSquares / timeBuf.length);
      return Math.max(0, 20 * Math.log10(rms) + 90);
    }

    function updateAccumulator(db) {
      STATE.acc.min = Math.min(STATE.acc.min, db);
      STATE.acc.max = Math.max(STATE.acc.max, db);
      STATE.acc.sum += db;
      STATE.acc.count += 1;
      STATE.history.push(db);
      if (STATE.history.length > MAX_HISTORY) {
        STATE.history.shift();
      }
    }

    function resetCaptureWindow() {
      STATE.acc = { min: Infinity, max: -Infinity, sum: 0, count: 0 };
      STATE.history = [];
    }

    function captureSpot() {
      if (!STATE.running || !STATE.fftBuf || STATE.acc.count === 0) return;
      const currentAvg = getCurrentAverage();
      const variance = getCurrentVariance();
      const relBands = calculateBands(STATE.fftBuf, currentAvg);
      const fftSnapshot = new Float32Array(STATE.fftBuf);
      const fallbackName = `Position ${String(STATE.spots.length + 1).padStart(2, "0")}`;
      const spot = {
        id: Date.now(),
        name: els.spotName.value.trim() || fallbackName,
        avg: currentAvg,
        min: STATE.acc.min,
        max: STATE.acc.max,
        variance,
        sampleCount: STATE.acc.count,
        timestamp: new Date().toLocaleString(),
        bands: relBands.map((band) => ({
          label: band.label,
          relDb: band.relDb,
          absDb: currentAvg + band.relDb
        })),
        fftSnapshot
      };
      STATE.spots.push(spot);
      els.spotName.value = "";
      resetCaptureWindow();
      renderAll();
      drawHistory();
      drawSpectrum(STATE.fftBuf);
    }

    function clearAllSpots() {
      STATE.spots = [];
      STATE.expandedCards = {};
      renderAll();
    }

    function getCurrentAverage() {
      return STATE.acc.count ? STATE.acc.sum / STATE.acc.count : 0;
    }

    function getCurrentVariance() {
      return standardDeviation(STATE.history);
    }

    function standardDeviation(values) {
      if (!values.length) return 0;
      const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
      const variance = values.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / values.length;
      return Math.sqrt(variance);
    }

    function calculateBands(fftValues, currentAvg) {
      if (!fftValues || !fftValues.length) {
        return BANDS.map((center) => ({ label: formatBandLabel(center), relDb: 0, absDb: currentAvg }));
      }
      const rawBandDb = BANDS.map((center) => calculateBandDb(fftValues, center));
      const usable = rawBandDb.filter(Number.isFinite);
      const reference = usable.length ? usable.reduce((sum, value) => sum + value, 0) / usable.length : 0;
      return BANDS.map((center, index) => {
        const raw = Number.isFinite(rawBandDb[index]) ? rawBandDb[index] : reference;
        const relDb = clamp(raw - reference, -36, 36);
        return {
          label: formatBandLabel(center),
          relDb,
          absDb: currentAvg + relDb
        };
      });
    }

    function calculateBandDb(fftValues, center) {
      const sampleRate = STATE.audioCtx ? STATE.audioCtx.sampleRate : 48000;
      const binHz = sampleRate / 4096;
      const low = center / Math.SQRT2;
      const high = center * Math.SQRT2;
      let power = 0;
      for (let i = 0; i < fftValues.length; i += 1) {
        const frequency = i * binHz;
        if (frequency >= low && frequency <= high) {
          power += Math.pow(10, fftValues[i] / 10);
        }
      }
      return power > 0 ? 10 * Math.log10(power) : -120;
    }

    function renderAll() {
      const latest = STATE.history.length ? STATE.history[STATE.history.length - 1] : null;
      renderControls();
      renderMeter(latest);
      renderLiveBands(latest);
      renderSpotsList();
      renderAnalysis();
    }

    function renderControls() {
      els.startStopBtn.textContent = STATE.running ? "Stop" : "Start";
      els.micPill.dataset.active = String(STATE.running);
      els.micPill.querySelector("span:last-child").textContent = STATE.running ? "Mic active" : "Mic inactive";
      els.captureBtn.disabled = !STATE.running || STATE.acc.count === 0;
    }

    function renderMeter(db) {
      const activeDb = Number.isFinite(db) ? db : null;
      if (activeDb === null) {
        els.dbValue.textContent = "—";
        els.dbReadout.style.color = "var(--green)";
        els.levelPin.style.left = "0%";
        renderEnvironment(0);
      } else {
        els.dbValue.textContent = activeDb.toFixed(1);
        els.dbReadout.style.color = levelColor(activeDb);
        els.levelPin.style.left = `${clamp(activeDb / DB_MAX, 0, 1) * 100}%`;
        renderEnvironment(activeDb);
      }
      renderStats();
      renderSampleHint();
      renderControls();
    }

    function renderEnvironment(db) {
      let label = "Silence";
      if (db >= 75) label = "Very Loud";
      else if (db >= 60) label = "Loud";
      else if (db >= 45) label = "Moderate";
      else if (db >= 30) label = "Quiet";
      const color = levelColor(db);
      els.envText.textContent = label;
      els.envBadge.style.borderColor = color;
      els.envDot.style.background = color;
    }

    function renderStats() {
      if (!STATE.acc.count) {
        els.statMin.textContent = "—";
        els.statAvg.textContent = "—";
        els.statMax.textContent = "—";
        els.statVar.textContent = "—";
        return;
      }
      els.statMin.textContent = formatDb(STATE.acc.min);
      els.statAvg.textContent = formatDb(getCurrentAverage());
      els.statMax.textContent = formatDb(STATE.acc.max);
      els.statVar.textContent = getCurrentVariance().toFixed(1);
    }

    function renderSampleHint() {
      const count = STATE.acc.count;
      const ready = count >= 10;
      els.sampleHint.dataset.ready = String(ready);
      els.sampleHint.textContent = ready ? `✓ Ready — ${count} samples` : `Collecting… (${count})`;
    }

    function renderLiveBands(db) {
      const avg = STATE.acc.count ? getCurrentAverage() : (Number.isFinite(db) ? db : 0);
      const bands = STATE.fftBuf ? calculateBands(STATE.fftBuf, avg) : calculateBands(null, avg);
      const expanded = STATE.expandedCards.bands === true;
      els.bandsHint.textContent = expanded ? "Tap bands to hide values" : "Tap bands to show values";
      els.bandsGrid.innerHTML = bands.map((band) => {
        const level = Number.isFinite(band.absDb) ? band.absDb : 0;
        const width = clamp(level / DB_MAX, 0, 1) * 100;
        const color = bandColor(level);
        return `
          <div class="band-box">
            <div class="band-label">${escapeHtml(band.label)}</div>
            <div class="band-track"><div class="band-fill" style="width:${width.toFixed(1)}%;background:${color}"></div></div>
            ${expanded ? `<div class="band-value" style="color:${color}">${formatDb(level)}</div>` : ""}
          </div>
        `;
      }).join("");
    }

    function renderSpotsList() {
      if (!STATE.spots.length) {
        els.spotsList.innerHTML = `<div class="empty-state">No captured room positions yet.</div>`;
        return;
      }
      els.spotsList.innerHTML = STATE.spots.map((spot, index) => {
        const color = levelColor(spot.avg);
        const open = STATE.expandedCards[`spot-${spot.id}`] === true;
        const preview = [0, 2, 4, 6].map((bandIndex) => {
          const band = spot.bands[bandIndex];
          return `<span class="preview-pill">${escapeHtml(band.label)} ${formatDb(band.absDb)}</span>`;
        }).join("");
        return `
          <article class="spot-card" data-toggle-spot="${spot.id}">
            <div class="spot-index">${String(index + 1).padStart(2, "0")}</div>
            <div class="spot-main">
              <div class="spot-name">${escapeHtml(spot.name)}</div>
            </div>
            <div class="spot-db" style="color:${color}">${spot.avg.toFixed(1)}</div>
            <button class="icon-button" type="button" data-remove-spot="${spot.id}" title="Remove ${escapeHtml(spot.name)}" aria-label="Remove ${escapeHtml(spot.name)}">×</button>
            ${open ? `<div class="spot-preview"><span class="spot-meta">${escapeHtml(spot.timestamp)} · ${spot.sampleCount} samples</span>${preview}</div>` : ""}
          </article>
        `;
      }).join("");
    }

    function toggleBands() {
      STATE.expandedCards.bands = STATE.expandedCards.bands !== true;
      renderLiveBands(STATE.history.length ? STATE.history[STATE.history.length - 1] : null);
    }

    function renderAnalysis() {
      if (!STATE.spots.length) {
        els.analysisContent.innerHTML = `<div class="empty-state">No captured positions. Capture at least one spot on the Meter tab to build an acoustic analysis report.</div>`;
        return;
      }
      const reportTime = new Date().toLocaleString();
      const sections = [
        renderReportHeader(reportTime),
        STATE.spots.length > 1 ? renderComparisonSection() : "",
        STATE.spots.length > 1 ? renderOverviewFindings() : "",
        STATE.spots.map((spot, index) => renderReportCard(spot, index, STATE.spots)).join("")
      ];
      els.analysisContent.innerHTML = sections.join("");
      setTimeout(renderAnalysisCanvases, 100);
    }

    function renderReportHeader(reportTime) {
      const count = STATE.spots.length;
      return `
        <section class="panel report-header">
          <div>
            <h1 class="report-title">Acoustic Analysis Report</h1>
            <div class="spot-meta">${count} ${count === 1 ? "position" : "positions"}</div>
          </div>
          <div class="report-meta">${escapeHtml(reportTime)}</div>
        </section>
      `;
    }

    function renderComparisonSection() {
      return `
        <section class="panel">
          <h2 class="section-title">Comparison Chart</h2>
          <canvas id="comparisonCanvas" class="comparison-canvas" height="260" aria-label="Captured position comparison chart"></canvas>
        </section>
      `;
    }

    function renderOverviewFindings() {
      const roomAvg = mean(STATE.spots.map((spot) => spot.avg));
      const quietest = STATE.spots.reduce((best, spot) => spot.avg < best.avg ? spot : best, STATE.spots[0]);
      const loudest = STATE.spots.reduce((best, spot) => spot.avg > best.avg ? spot : best, STATE.spots[0]);
      const spread = loudest.avg - quietest.avg;
      const bassLeader = STATE.spots.map((spot) => ({ spot, tilt: getBassTilt(spot) })).reduce((best, item) => item.tilt > best.tilt ? item : best);
      const stable = STATE.spots.reduce((best, spot) => spot.variance < best.variance ? spot : best, STATE.spots[0]);
      const unstable = STATE.spots.reduce((best, spot) => spot.variance > best.variance ? spot : best, STATE.spots[0]);
      const spreadText = spread > 12
        ? `${spread.toFixed(1)} dB spread: significant modal distribution`
        : `${spread.toFixed(1)} dB spread: controlled position distribution`;
      const bullets = [
        `Room mean is ${formatDb(roomAvg)} dB; ${spreadText}.`,
        `${escapeHtml(quietest.name)} is quietest at ${formatDb(quietest.avg)} dB, ${escapeHtml(loudest.name)} is loudest at ${formatDb(loudest.avg)} dB.`,
        `${escapeHtml(bassLeader.spot.name)} has the strongest bass tilt at ${signed(bassLeader.tilt)} dB; stability runs from ±${stable.variance.toFixed(1)} to ±${unstable.variance.toFixed(1)} dB.`
      ];
      return `
        <section class="panel">
          <h2 class="section-title">Room Overview Findings</h2>
          <ul class="finding-list">
            ${bullets.map((bullet) => `<li class="finding-item">${bullet}</li>`).join("")}
          </ul>
        </section>
      `;
    }

    function renderReportCard(spot, index, allSpots) {
      const assessment = assessSpot(spot, allSpots);
      const open = STATE.expandedCards[`report-${spot.id}`] === true;
      const qualityColor = qualityColorForScore(assessment.score);
      return `
        <article class="report-card">
          <button class="report-card-head" type="button" data-toggle-card="${spot.id}" aria-expanded="${open}">
            <div class="spot-index">${String(index + 1).padStart(2, "0")}</div>
            <div class="report-name">${escapeHtml(spot.name)}</div>
            <div class="report-avg" style="color:${levelColor(spot.avg)}">${spot.avg.toFixed(1)} dB</div>
            <div class="report-score">Score: ${assessment.score}</div>
            <div class="collapse-arrow">${open ? "▲" : "▼"}</div>
          </button>
          ${open ? renderReportBody(spot, assessment, qualityColor) : ""}
        </article>
      `;
    }

    function renderReportBody(spot, assessment, qualityColor) {
      const stabilityScore = clamp(100 - (spot.variance * 5), 0, 100);
      const stabilityColor = spot.variance < 5 ? "var(--green)" : spot.variance < 10 ? "var(--amber)" : "var(--red)";
      const activeSection = getReportSection(spot.id);
      return `
        <div class="report-card-body">
          ${renderSectionTabs(spot.id, activeSection)}
          ${activeSection === "metrics" ? renderMetricsSection(spot, assessment, qualityColor, stabilityScore, stabilityColor) : ""}
          ${activeSection === "spectrum" ? renderSpectrumSection(spot) : ""}
          ${activeSection === "assessment" ? renderAssessmentSection(spot, assessment) : ""}
          ${activeSection === "recs" ? renderRecommendationsSection(assessment) : ""}
        </div>
      `;
    }

    function renderSectionTabs(id, activeSection) {
      const tabs = [
        ["metrics", "Metrics"],
        ["spectrum", "Spectrum"],
        ["assessment", "Assessment"],
        ["recs", "Recs"]
      ];
      return `
        <div class="section-tabs" role="tablist" aria-label="Report detail sections">
          ${tabs.map(([key, label]) => `
            <button class="section-tab" type="button" data-section-tab="${id}" data-report-section="${key}" data-section-active="${activeSection === key}">
              ${label}
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderMetricsSection(spot, assessment, qualityColor, stabilityScore, stabilityColor) {
      return `
        <div class="metrics-row">
          ${metricTile("Min", formatDb(spot.min), "var(--blue)")}
          ${metricTile("Avg", formatDb(spot.avg), "var(--amber)")}
          ${metricTile("Max", formatDb(spot.max), "var(--red)")}
          ${metricTile("±Var", `±${spot.variance.toFixed(1)}`, "var(--purple)")}
        </div>
        <div class="band-values-row">
          ${spot.bands.map((band) => {
            const color = bandColor(band.absDb);
            return `<div class="band-value-box"><div class="band-label">${escapeHtml(band.label)}</div><div class="band-value" style="color:${color}">${formatDb(band.absDb)}</div></div>`;
          }).join("")}
        </div>
        <div class="score-wrap">
          <div class="score-line">
            <div class="score-label"><span>Acoustic Quality: ${assessment.score}/100 — ${assessment.quality}</span></div>
            <div class="score-bar"><div class="score-fill" style="width:${assessment.score}%;background:${qualityColor}"></div></div>
          </div>
          <div class="score-line">
            <div class="score-label"><span>Temporal Stability</span><span>±${spot.variance.toFixed(1)} dB</span></div>
            <div class="score-bar"><div class="score-fill" style="width:${stabilityScore.toFixed(0)}%;background:${stabilityColor}"></div></div>
          </div>
        </div>
      `;
    }

    function renderSpectrumSection(spot) {
      return `<canvas id="fftSnap-${spot.id}" class="snapshot-canvas" height="70" aria-label="FFT snapshot for ${escapeHtml(spot.name)}"></canvas>`;
    }

    function renderAssessmentSection(spot, assessment) {
      const key = `assessment-${spot.id}`;
      const expanded = STATE.expandedCards[key] === true;
      const visibleLines = expanded ? assessment.lines : assessment.lines.slice(0, 3);
      return `
        <div class="assessment">
          ${visibleLines.map((line) => `<div class="assessment-line">${escapeHtml(line)}</div>`).join("")}
          ${assessment.lines.length > 3 ? `<button class="assessment-more" type="button" data-read-assessment="${spot.id}">${expanded ? "Show less" : "Read more"}</button>` : ""}
        </div>
      `;
    }

    function renderRecommendationsSection(assessment) {
      return `
        <div class="recommendations">
          ${assessment.recommendations.map((rec) => `<div class="recommendation">◆ ${escapeHtml(rec)}</div>`).join("")}
        </div>
      `;
    }

    function getReportSection(id) {
      const sections = ["metrics", "spectrum", "assessment", "recs"];
      const active = sections.find((section) => STATE.expandedCards[`section-${id}-${section}`] === true);
      return active || "metrics";
    }

    function setReportSection(id, section) {
      ["metrics", "spectrum", "assessment", "recs"].forEach((name) => {
        STATE.expandedCards[`section-${id}-${name}`] = name === section;
      });
    }

    function metricTile(label, value, color) {
      return `<div class="metric-tile"><div class="metric-label">${label}</div><div class="metric-value" style="color:${color}">${value}</div></div>`;
    }

    function assessSpot(spot, allSpots) {
      const bassAvg = mean([spot.bands[0].absDb, spot.bands[1].absDb]);
      const midAvg = mean([spot.bands[3].absDb, spot.bands[4].absDb]);
      const highMean = mean([spot.bands[6].absDb, spot.bands[7].absDb]);
      const bassTilt = bassAvg - midAvg;
      const highTilt = highMean - midAvg;
      const values = spot.bands.map((band) => band.absDb);
      const spread = Math.max(...values) - Math.min(...values);
      const crest = spot.max - spot.avg;
      const roomAvg = mean(allSpots.map((item) => item.avg));
      const positionDelta = spot.avg - roomAvg;
      let score = baseScore(spot.avg);

      if (spot.variance > 15) score -= 14;
      else if (spot.variance > 9) score -= 8;
      else if (spot.variance > 5) score -= 3;
      if (Math.abs(bassTilt) > 10) score -= 10;
      else if (Math.abs(bassTilt) >= 5) score -= 5;
      if (spread > 30) score -= 7;
      if (crest > 20) score -= 5;
      if (positionDelta > 4) score -= 5;
      if (spot.variance < 3) score += 4;
      if (spread < 18) score += 5;
      if (positionDelta < -4) score += 5;

      score = Math.max(5, Math.min(100, Math.round(score)));
      const quality = qualityLabel(score);
      const lines = [
        levelVerdict(spot.avg),
        `Variance at this position is ±${spot.variance.toFixed(1)} dB over ${spot.sampleCount} samples.`,
        `Crest factor is ${crest.toFixed(1)} dB above the average, with max level ${spot.max.toFixed(1)} dB.`,
        bassTiltNote(bassTilt),
        highTiltNote(highTilt),
        spread > 30 ? `Large spectral coloration (${spread.toFixed(1)} dB spread).` : spread < 18 ? `Spectrally flat position (${spread.toFixed(1)} dB spread).` : `Moderate spectral spread (${spread.toFixed(1)} dB).`,
        positionDelta >= 0 ? `${positionDelta.toFixed(1)} dB louder than room average.` : `${Math.abs(positionDelta).toFixed(1)} dB quieter than room average.`
      ];
      const recommendations = buildRecommendations({ spot, bassTilt, highTilt, spread, crest, positionDelta });
      return { score, quality, lines, recommendations, bassTilt, highTilt, spread, crest, positionDelta };
    }

    function buildRecommendations(metrics) {
      const { spot, bassTilt, highTilt, spread, crest, positionDelta } = metrics;
      const recs = [];
      if (bassTilt > 10) {
        recs.push(`Bass tilt of ${signed(bassTilt)} dB at this position: place 100mm mineral wool floor-to-ceiling in the closest corner.`);
      } else if (bassTilt >= 5) {
        recs.push(`Mild bass emphasis of ${signed(bassTilt)} dB: move the mic or listening point 20-40 cm away from the nearest boundary and remeasure.`);
      } else if (bassTilt < -5) {
        recs.push(`Bass null of ${bassTilt.toFixed(1)} dB: shift the position along the room length by 30-60 cm before adding EQ.`);
      }
      if (highTilt > 8) {
        recs.push(`High-frequency lift of ${signed(highTilt)} dB: treat the nearest hard reflection point with a 50mm absorber or diffuser.`);
      } else if (highTilt < -12) {
        recs.push(`High-frequency rolloff of ${highTilt.toFixed(1)} dB: reduce nearby soft obstruction or shorten mic distance before judging absorption.`);
      }
      if (spot.variance > 9) {
        recs.push(`Temporal swing of ±${spot.variance.toFixed(1)} dB: pause HVAC, fans, or external noise sources and repeat a 10-second capture.`);
      }
      if (spread > 30) {
        recs.push(`Spectral spread of ${spread.toFixed(1)} dB: combine corner trapping with first-reflection control before applying narrow EQ.`);
      }
      if (spot.avg > 60) {
        recs.push(`Average level is ${spot.avg.toFixed(1)} dB: reduce equipment noise or close the noise path before making mix decisions here.`);
      }
      if (crest > 20) {
        recs.push(`Crest factor of ${crest.toFixed(1)} dB: identify intermittent clicks or handling noise before using this spot as a reference.`);
      }
      if (positionDelta > 4) {
        recs.push(`This spot is ${positionDelta.toFixed(1)} dB louder than room average: avoid it for noise-floor checks unless the source is intentional.`);
      } else if (positionDelta < -4) {
        recs.push(`This spot is ${Math.abs(positionDelta).toFixed(1)} dB quieter than room average: use it as the baseline when comparing treatment changes.`);
      }
      if (!recs.length) {
        recs.push(`Keep this position as a reference: variance is ±${spot.variance.toFixed(1)} dB and spectral spread is ${spread.toFixed(1)} dB.`);
        recs.push(`Recheck after any furniture change: current average is ${spot.avg.toFixed(1)} dB with bass tilt ${signed(bassTilt)} dB.`);
      }
      while (recs.length < 2) {
        recs.push(`Capture a second pass here after moving 30 cm: compare against the current ${spot.avg.toFixed(1)} dB average.`);
      }
      return recs.slice(0, 4);
    }

    function baseScore(avg) {
      if (avg < 30) return 96;
      if (avg < 38) return 90;
      if (avg < 45) return 82;
      if (avg < 52) return 72;
      if (avg < 60) return 58;
      if (avg < 68) return 40;
      if (avg < 75) return 25;
      return 10;
    }

    function qualityLabel(score) {
      if (score >= 85) return "Excellent";
      if (score >= 70) return "Good";
      if (score >= 55) return "Acceptable";
      if (score >= 35) return "Poor";
      return "Critical";
    }

    function qualityColorForScore(score) {
      if (score >= 85) return "var(--green)";
      if (score >= 55) return "var(--amber)";
      return "var(--red)";
    }

    function levelVerdict(avg) {
      if (avg < 30) return `Very low noise floor at ${avg.toFixed(1)} dB SPL; suitable for critical quiet-room work.`;
      if (avg < 45) return `Quiet position at ${avg.toFixed(1)} dB SPL; generally usable for monitoring and measurement.`;
      if (avg < 60) return `Moderate ambient level at ${avg.toFixed(1)} dB SPL; usable but background noise can mask fine detail.`;
      if (avg < 70) return `Loud ambient level at ${avg.toFixed(1)} dB SPL; acoustic decisions here are noise-biased.`;
      return `Very loud position at ${avg.toFixed(1)} dB SPL; fix the noise source before judging room response.`;
    }

    function bassTiltNote(tilt) {
      if (tilt > 10) return `Corner bass buildup: ${signed(tilt)} dB above mids. Room mode accumulation.`;
      if (tilt >= 5) return `Mild bass emphasis: ${signed(tilt)} dB. Some corner reinforcement.`;
      if (tilt >= -5) return `Balanced bass-to-mid ratio (${tilt.toFixed(1)} dB tilt). No buildup detected.`;
      return `Bass null detected: ${tilt.toFixed(1)} dB below mids. Standing wave destructive zone.`;
    }

    function highTiltNote(tilt) {
      if (tilt > 8) return `HF elevation: hard reflective surface nearby (${signed(tilt)} dB above mids).`;
      if (tilt < -12) return `HF rolloff: absorptive surfaces or distance (${tilt.toFixed(1)} dB versus mids).`;
      return `High-frequency tilt is ${signed(tilt)} dB versus mids.`;
    }

    function getBassTilt(spot) {
      const bassAvg = mean([spot.bands[0].absDb, spot.bands[1].absDb]);
      const midAvg = mean([spot.bands[3].absDb, spot.bands[4].absDb]);
      return bassAvg - midAvg;
    }

    function drawHistory() {
      const canvas = els.historyCanvas;
      const ctx = prepareCanvas(canvas, 60);
      const width = canvasCssWidth(canvas);
      const height = 60;
      ctx.clearRect(0, 0, width, height);
      drawGrid(ctx, width, height, 4, 3);
      const values = STATE.history;
      if (!values.length) {
        drawCanvasLabel(ctx, "Waiting for samples", width, height);
        return;
      }
      ctx.beginPath();
      values.forEach((db, index) => {
        const x = values.length === 1 ? 0 : (index / (values.length - 1)) * width;
        const norm = Math.log10(1 + clamp(db, 0, DB_MAX)) / Math.log10(1 + DB_MAX);
        const y = height - norm * (height - 8) - 4;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      const fill = ctx.createLinearGradient(0, 0, 0, height);
      fill.addColorStop(0, "rgba(245, 166, 35, 0.42)");
      fill.addColorStop(1, "rgba(245, 166, 35, 0.04)");
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.beginPath();
      values.forEach((db, index) => {
        const x = values.length === 1 ? 0 : (index / (values.length - 1)) * width;
        const norm = Math.log10(1 + clamp(db, 0, DB_MAX)) / Math.log10(1 + DB_MAX);
        const y = height - norm * (height - 8) - 4;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "rgba(245, 166, 35, 0.95)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawSpectrum(fftValues) {
      const canvas = els.fftCanvas;
      const ctx = prepareCanvas(canvas, 60);
      drawFftCanvas(ctx, canvasCssWidth(canvas), 60, fftValues, 2, true);
    }

    function drawFftSnapshot(canvas, fftValues) {
      if (!canvas) return;
      const ctx = prepareCanvas(canvas, 70);
      drawFftCanvas(ctx, canvasCssWidth(canvas), 70, fftValues, 1.5, false);
    }

    function drawFftCanvas(ctx, width, height, fftValues, lineWidth, labels) {
      ctx.clearRect(0, 0, width, height);
      drawGrid(ctx, width, height, 6, 3);
      if (!fftValues || !fftValues.length) {
        drawCanvasLabel(ctx, "No FFT data", width, height);
        return;
      }
      const sampleRate = STATE.audioCtx ? STATE.audioCtx.sampleRate : 48000;
      const binHz = sampleRate / 4096;
      const minFreq = 20;
      const maxFreq = 20000;
      const minLog = Math.log10(minFreq);
      const maxLog = Math.log10(maxFreq);

      ctx.beginPath();
      let started = false;
      for (let i = 1; i < fftValues.length; i += 1) {
        const frequency = i * binHz;
        if (frequency < minFreq || frequency > maxFreq) continue;
        const x = ((Math.log10(frequency) - minLog) / (maxLog - minLog)) * width;
        const norm = clamp((fftValues[i] - FFT_MIN_DB) / (FFT_MAX_DB - FFT_MIN_DB), 0, 1);
        const y = height - norm * (height - 10) - 5;
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      const fill = ctx.createLinearGradient(0, 0, 0, height);
      fill.addColorStop(0, "rgba(245, 166, 35, 0.34)");
      fill.addColorStop(1, "rgba(245, 166, 35, 0.02)");
      ctx.fillStyle = fill;
      ctx.fill();

      ctx.beginPath();
      started = false;
      for (let i = 1; i < fftValues.length; i += 1) {
        const frequency = i * binHz;
        if (frequency < minFreq || frequency > maxFreq) continue;
        const x = ((Math.log10(frequency) - minLog) / (maxLog - minLog)) * width;
        const norm = clamp((fftValues[i] - FFT_MIN_DB) / (FFT_MAX_DB - FFT_MIN_DB), 0, 1);
        const y = height - norm * (height - 10) - 5;
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.strokeStyle = "rgba(245, 166, 35, 0.96)";
      ctx.lineWidth = lineWidth;
      ctx.stroke();

      if (labels) {
        ctx.fillStyle = "rgba(201, 209, 217, 0.58)";
        ctx.font = "11px Share Tech Mono, Courier New, monospace";
        [20, 100, 1000, 10000, 20000].forEach((frequency) => {
          const x = ((Math.log10(frequency) - minLog) / (maxLog - minLog)) * width;
          ctx.fillText(frequency >= 1000 ? `${frequency / 1000}k` : `${frequency}`, Math.min(width - 24, Math.max(2, x - 10)), height - 6);
        });
      }
    }

    function drawComparisonChart() {
      const canvas = document.getElementById("comparisonCanvas");
      if (!canvas) return;
      const ctx = prepareCanvas(canvas, 260);
      const width = canvasCssWidth(canvas);
      const height = 260;
      ctx.clearRect(0, 0, width, height);
      drawGrid(ctx, width, height, 5, 4);
      const chartTop = 18;
      const chartBottom = height - 54;
      const chartHeight = chartBottom - chartTop;
      const gap = 12;
      const barWidth = Math.max(22, (width - gap * (STATE.spots.length + 1)) / STATE.spots.length);

      STATE.spots.forEach((spot, index) => {
        const x = gap + index * (barWidth + gap);
        const avgNorm = clamp(spot.avg / 100, 0, 1);
        const barHeight = avgNorm * chartHeight;
        const y = chartBottom - barHeight;
        const markerMinY = chartBottom - clamp(spot.min / 100, 0, 1) * chartHeight;
        const markerMaxY = chartBottom - clamp(spot.max / 100, 0, 1) * chartHeight;
        const gradient = ctx.createLinearGradient(0, y, 0, chartBottom);
        gradient.addColorStop(0, levelColor(spot.avg));
        gradient.addColorStop(1, "rgba(245, 166, 35, 0.18)");
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, barWidth, barHeight);
        ctx.strokeStyle = "rgba(201, 209, 217, 0.74)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + barWidth / 2, markerMaxY);
        ctx.lineTo(x + barWidth / 2, markerMinY);
        ctx.moveTo(x + barWidth * 0.25, markerMaxY);
        ctx.lineTo(x + barWidth * 0.75, markerMaxY);
        ctx.moveTo(x + barWidth * 0.25, markerMinY);
        ctx.lineTo(x + barWidth * 0.75, markerMinY);
        ctx.stroke();
        ctx.fillStyle = "rgba(201, 209, 217, 0.85)";
        ctx.font = "12px Rajdhani, Courier New, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(trimLabel(spot.name, 12), x + barWidth / 2, height - 30);
        ctx.fillStyle = levelColor(spot.avg);
        ctx.font = "13px Share Tech Mono, Courier New, monospace";
        ctx.fillText(`${spot.avg.toFixed(1)} dB`, x + barWidth / 2, height - 13);
      });
      ctx.textAlign = "left";
    }

    function renderAnalysisCanvases() {
      drawComparisonChart();
      STATE.spots.forEach((spot) => {
        const canvas = document.getElementById(`fftSnap-${spot.id}`);
        drawFftSnapshot(canvas, spot.fftSnapshot);
      });
    }

    function resizeVisuals() {
      prepareCanvas(els.historyCanvas, 60);
      prepareCanvas(els.fftCanvas, 60);
      const comparison = document.getElementById("comparisonCanvas");
      if (comparison) prepareCanvas(comparison, 260);
      STATE.spots.forEach((spot) => {
        const snapshot = document.getElementById(`fftSnap-${spot.id}`);
        if (snapshot) prepareCanvas(snapshot, 70);
      });
    }

    function prepareCanvas(canvas, cssHeight) {
      const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const width = canvasCssWidth(canvas);
      const height = cssHeight;
      const targetWidth = Math.round(width * ratio);
      const targetHeight = Math.round(height * ratio);
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return ctx;
    }

    function canvasCssWidth(canvas) {
      const rect = canvas.getBoundingClientRect();
      const parentWidth = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
      return Math.max(1, Math.round(rect.width || canvas.clientWidth || canvas.offsetWidth || parentWidth || 320));
    }

    function drawGrid(ctx, width, height, columns, rows) {
      ctx.strokeStyle = "rgba(30, 45, 61, 0.72)";
      ctx.lineWidth = 1;
      for (let i = 1; i < columns; i += 1) {
        const x = (i / columns) * width;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let i = 1; i < rows; i += 1) {
        const y = (i / rows) * height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawCanvasLabel(ctx, text, width, height) {
      ctx.fillStyle = "rgba(85, 96, 112, 0.9)";
      ctx.font = "13px Rajdhani, Courier New, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, width / 2, height / 2 + 4);
      ctx.textAlign = "left";
    }

    function setView(view) {
      const isAnalysis = view === "analysis";
      els.meterPanel.dataset.visible = String(!isAnalysis);
      els.analysisPanel.dataset.visible = String(isAnalysis);
      els.tabs.forEach((tab) => {
        tab.dataset.current = String(tab.dataset.tab === view);
      });
      if (isAnalysis) {
        renderAnalysis();
      }
    }

    function installManifest() {
      const iconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="96" fill="#080a0c"/>
          <path d="M90 318c35-84 66-126 96-126 43 0 45 126 88 126 33 0 58-72 78-126 17 42 39 84 70 126" fill="none" stroke="#f5a623" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="256" cy="256" r="178" fill="none" stroke="#1e2d3d" stroke-width="22"/>
          <text x="256" y="410" text-anchor="middle" font-family="monospace" font-size="54" fill="#f5a623">ACO</text>
        </svg>`;
      const icon = `data:image/svg+xml,${encodeURIComponent(iconSvg)}`;
      const manifest = {
        name: "ROOM ACO METER",
        short_name: "ACO Meter",
        start_url: "./index.html",
        scope: "./",
        display: "standalone",
        background_color: "#080a0c",
        theme_color: "#080a0c",
        icons: [
          { src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
          { src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = `data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
      document.head.append(link);
    }

    function levelColor(db) {
      if (db < 45) return "var(--green)";
      if (db <= 70) return "var(--amber)";
      return "var(--red)";
    }

    function bandColor(db) {
      if (db < 45) return "var(--blue)";
      if (db <= 65) return "var(--amber)";
      return "var(--red)";
    }

    function formatDb(value) {
      return Number.isFinite(value) ? `${value.toFixed(1)}` : "—";
    }

    function formatBandLabel(value) {
      return value >= 1000 ? `${value / 1000}kHz` : `${value}Hz`;
    }

    function mean(values) {
      const finite = values.filter(Number.isFinite);
      return finite.length ? finite.reduce((sum, value) => sum + value, 0) / finite.length : 0;
    }

    function signed(value) {
      return `${value >= 0 ? "+" : ""}${value.toFixed(1)}`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function trimLabel(text, length) {
      return text.length > length ? `${text.slice(0, length - 1)}…` : text;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
